<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — MovieTracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="auth.css">  </head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo" onclick="window.location.href='index.html'">
                MOVIE<span class="dot">.</span>TR
            </div>
            
            <div id="auth-forms">
                <div id="login-section">
                    <h2>Вход</h2>
                    <form id="login-form">
                        <input type="email" placeholder="Email" required>
                        <input type="password" placeholder="Пароль" required>
                        <button type="submit" class="auth-btn">Войти</button>
                    </form>
                    <p class="switch-text">Впервые у нас? <a href="#" onclick="toggleAuth()">Регистрация</a></p>
                </div>

                <div id="signup-section" style="display: none;">
                    <h2>Регистрация</h2>
                    <form id="signup-form">
                        <input type="text" placeholder="Имя пользователя" required>
                        <input type="email" placeholder="Email" required>
                        <input type="password" placeholder="Пароль" required>
                        <button type="submit" class="auth-btn">Создать аккаунт</button>
                    </form>
                    <p class="switch-text">Уже есть аккаунт? <a href="#" onclick="toggleAuth()">Войти</a></p>
                </div>
            </div>
            
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> На главную</a>
        </div>
    </div>

    
        <script src="auth.js"></script>
    
</body>
</html>
